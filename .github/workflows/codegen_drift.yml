---
name: Codegen drift
on:
  push:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
    paths: &trigger-paths
      - '.github/workflows/codegen_drift.yml'
      - '.github/actions/codegen_drift/action.yml'
      - 'Justfile'
      - 'tools/copyright-header.txt'
      - 'radio/src/dataconstants.h'
      # LVGL fonts
      - 'radio/src/fonts/**'
      # LVGL font character coverage
      - 'radio/src/translations/i18n/**'
      # web simulator radio list
      - 'radio/src/boards/hw_defs/**'
      - 'fw.json'
      - 'web/scripts/gen-radios-json.js'
      - 'web/public/radios.json'
  pull_request:
    paths: *trigger-paths
  workflow_dispatch:

# These jobs fail on drift so it's visible on the PR, but none of them are
# configured as required status checks - a contributor without the local
# toolchain can still merge.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: '1.57.0'

jobs:
  changes:
    name: Detect changed inputs
    runs-on: ubuntu-latest
    outputs:
      fonts: ${{ steps.filter.outputs.fonts }}
      radios: ${{ steps.filter.outputs.radios }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install just
        run: |
          wget -qO- "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /usr/local/bin just

      # A Justfile change cannot cause drift, but it can break the file, and
      # parsing validates every recipe rather than only the ones below. Fails
      # here in seconds instead of in the container jobs; the list is derived,
      # so adding a recipe needs no change.
      - name: Validate the Justfile
        run: |
          just --list >/dev/null
          for recipe in $(just --summary); do
            just --show "${recipe}" >/dev/null
          done

      # Skipped on workflow_dispatch, which has no base revision to diff
      # against; the jobs below run unconditionally in that case.
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            fonts:
              - '.github/workflows/codegen_drift.yml'
              - '.github/actions/codegen_drift/action.yml'
              - 'radio/src/fonts/**'
              - 'radio/src/translations/i18n/**'
            radios:
              - '.github/workflows/codegen_drift.yml'
              - '.github/actions/codegen_drift/action.yml'
              - 'fw.json'
              - 'radio/src/boards/hw_defs/**'
              - 'web/scripts/gen-radios-json.js'
              - 'web/public/radios.json'

  fonts:
    name: LVGL fonts
    needs: changes
    if: needs.changes.outputs.fonts == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/edgetx/edgetx-dev:latest
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check for drift
        uses: ./.github/actions/codegen_drift
        with:
          recipe: gen-fonts
          paths: radio/src/fonts/lvgl
          label: LVGL fonts

  radios:
    name: Web simulator radio list
    needs: changes
    if: needs.changes.outputs.radios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/edgetx/edgetx-dev:latest
      volumes:
        - ${{ github.workspace }}:/src
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Check for drift
        uses: ./.github/actions/codegen_drift
        with:
          recipe: gen-radios
          paths: web/public/radios.json
          label: Web simulator radio list
